<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accede a Mimosa Spa Retreat</title>
</head>
<body style="margin: 0; padding: 0; background-color: #FDFAF5; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;">

  <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="background-color: #FDFAF5;">
    <tr>
      <td align="center" style="padding: 40px 20px;">

        <table role="presentation" cellpadding="0" cellspacing="0" width="500" style="max-width: 500px; background-color: #FFFFFF; border-radius: 12px;">

          <!-- Header -->
          <tr>
            <td align="center" style="padding: 32px 32px 24px 32px; background-color: #FDFAF5; border-radius: 12px 12px 0 0;">
              <div style="font-family: Georgia, serif; font-size: 28px; font-style: italic; color: #333333; line-height: 1.2;">Mimosa</div>
              <div style="font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 11px; color: #8B8680; letter-spacing: 3px; text-transform: uppercase; margin-top: 4px;">Spa Retreat</div>
            </td>
          </tr>

          <!-- Content -->
          <tr>
            <td style="padding: 32px;">

              <h1 style="margin: 0 0 12px 0; font-family: Georgia, serif; font-size: 22px; font-weight: 600; color: #333333; text-align: center;">
                Accede a tu cuenta
              </h1>

              <p style="margin: 0 0 24px 0; font-size: 15px; color: #8B8680; line-height: 1.5; text-align: center;">
                Haz clic en el botón para iniciar sesión de forma segura.
              </p>

              <!-- Button -->
              <table role="presentation" cellpadding="0" cellspacing="0" width="100%">
                <tr>
                  <td align="center" style="padding-bottom: 24px;">
                    <!--[if mso]>
                    <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" href="{{ .ConfirmationURL }}" style="height:48px;v-text-anchor:middle;width:200px;" arcsize="15%" strokecolor="#FCCF08" fillcolor="#FCCF08">
                      <center style="color:#333333;font-family:Helvetica,Arial,sans-serif;font-size:15px;font-weight:bold;">Iniciar sesión</center>
                    </v:roundrect>
                    <![endif]-->
                    <!--[if !mso]><!-->
                    <a href="{{ .ConfirmationURL }}" style="display: inline-block; padding: 14px 40px; background-color: #FCCF08; color: #333333; font-size: 15px; font-weight: 600; text-decoration: none; border-radius: 8px;">
                      Iniciar sesión
                    </a>
                    <!--<![endif]-->
                  </td>
                </tr>
              </table>

              <p style="margin: 0; font-size: 13px; color: #B8B5B1; text-align: center;">
                El enlace expira en 1 hora.
              </p>

            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding: 20px 32px; border-top: 1px solid #F5EFE7;">
              <p style="margin: 0; font-size: 12px; color: #B8B5B1; text-align: center;">
                Si no solicitaste este correo, ignóralo.
              </p>
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
